apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: stage
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "stage"
          serviceAccountRef:
            name: "vault-stage"