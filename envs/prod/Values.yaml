replicaCount: 3

image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  host: demo-prod.local
  annotations: {}
  tls: []

serviceAccount:
  create: true
  automount: true
  name: vault-prod

secrets:
  enabled: true
  vaultPath: prod/app
  vaultRole: prod
  serviceAccountName: vault-prod
