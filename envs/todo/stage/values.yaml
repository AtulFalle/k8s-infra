replicaCount: 1

image:
  repository: atulfalle1815/todo
  tag: "0.1.2"
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  name: vault-todo

config:
  APP_ENV: stage
  APP_VERSION: "0.1.2"

secrets:
  enabled: true
  vaultPath: stage/todo
  vaultRole: todo-stage

ingress:
  enabled: true
  className: nginx
  host: todo-stage.local

persistence:
  enabled: true
  size: 1Gi

cronjobs:
  cleanup:
    enabled: true
    schedule: "*/15 * * * *"
  digest:
    enabled: true
    schedule: "0 * * * *"
