replicaCount: 1

image:
  repository: atulfalle1815/todo
  tag: "0.1.1"
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  name: vault-todo

config:
  APP_ENV: stage
  APP_VERSION: "0.1.1"

secrets:
  enabled: true
  vaultPath: stage/todo
  vaultRole: todo-stage

ingress:
  enabled: true
  className: nginx
  host: todo-stage.local

persistence:
  enabled: true
  size: 1Gi

cronjob:
  enabled: true
  schedule: "*/15 * * * *"
