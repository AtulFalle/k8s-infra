replicaCount: 1

image:
  repository: atulfalle1815/todo
  tag: "0.1.0"
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  name: vault-todo

config:
  APP_ENV: prod
  APP_VERSION: "0.1.0"

secrets:
  enabled: true
  vaultPath: prod/todo
  vaultRole: todo-prod

ingress:
  enabled: true
  className: nginx
  host: todo-prod.local

persistence:
  enabled: true
  size: 1Gi
