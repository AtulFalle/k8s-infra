replicaCount: 1

image:
  repository: atulfalle1815/todo
  # CI pushes sha-* tags; Argo CD Image Updater sets the live tag on todo-dev.
  tag: "sha-bootstrap"
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  name: vault-todo

config:
  APP_ENV: dev

secrets:
  enabled: true
  vaultPath: dev/todo
  vaultRole: todo-dev

ingress:
  enabled: true
  className: nginx
  host: todo-dev.local

persistence:
  enabled: true
  size: 1Gi

cronjobs:
  cleanup:
    enabled: true
    schedule: "*/5 * * * *"
  digest:
    enabled: true
    schedule: "*/15 * * * *"
  # Enable to test Grafana job-failure alert in dev
  fail-once:
    enabled: false
    schedule: "*/30 * * * *"
