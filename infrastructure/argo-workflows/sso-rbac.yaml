apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-viewer
  namespace: argo
  annotations:
    workflows.argoproj.io/rbac-rule: "'Argo CD Viewers' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-viewer.service-account-token
  namespace: argo
  annotations:
    kubernetes.io/service-account.name: argo-workflows-viewer
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-server.service-account-token
  namespace: argo
  annotations:
    kubernetes.io/service-account.name: argo-workflows-server
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflows-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-workflows-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-viewer
subjects:
  - kind: ServiceAccount
    name: argo-workflows-viewer
    namespace: argo
