# Headlamp — Kubernetes ops UI (CronJob view / suspend / trigger)
replicaCount: 1

config:
  inCluster: true
  # POC mode: authenticate user via OIDC, then authorize Kubernetes calls
  # using the in-cluster Headlamp service account token.
  unsafeUseServiceAccountToken: true
  oidc:
    clientID: ""
    clientSecret: ""
    issuerURL: "http://authentik.local/application/o/headlamp/"
    scopes: "openid,profile,email"

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: headlamp.local
      paths:
        - path: /
          type: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
