# Grafana + Prometheus (kube-prometheus-stack) — lightweight Kind POC values
grafana:
  adminPassword: admin
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.local
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec: {}

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

additionalPrometheusRulesMap:
  todo-jobs:
    groups:
      - name: todo.jobs
        rules:
          - alert: TodoKubernetesJobFailed
            expr: kube_job_failed{namespace=~"todo-.*", condition="true"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Job {{ $labels.job_name }} failed in {{ $labels.namespace }}"
              description: "A Kubernetes Job in namespace {{ $labels.namespace }} has failed. Check Headlamp or kubectl logs."
