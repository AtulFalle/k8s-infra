authentik:
  error_reporting:
    enabled: false

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    usePasswordFiles: false

# OIDC app blueprints (Argo CD + Vault)
blueprints:
  configMaps:
    - authentik-blueprints

server:
  replicas: 1
  ingress:
    enabled: false
  env:
    - name: AUTHENTIK_BOOTSTRAP_EMAIL
      valueFrom:
        secretKeyRef:
          name: authentik-bootstrap
          key: email
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-bootstrap
          key: password
    # Blueprint !Env substitutions
    - name: ARGOCD_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: argocd-client-id
    - name: ARGOCD_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: argocd-client-secret
    - name: VAULT_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: vault-client-id
    - name: VAULT_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: vault-client-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  replicas: 1
  env:
    - name: AUTHENTIK_BOOTSTRAP_EMAIL
      valueFrom:
        secretKeyRef:
          name: authentik-bootstrap
          key: email
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-bootstrap
          key: password
    - name: ARGOCD_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: argocd-client-id
    - name: ARGOCD_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: argocd-client-secret
    - name: VAULT_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: vault-client-id
    - name: VAULT_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-clients
          key: vault-client-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
