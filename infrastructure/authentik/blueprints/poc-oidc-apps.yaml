# Authentik blueprints for POC OIDC apps (Argo CD, Vault, Headlamp, Argo Workflows).
# Client IDs/secrets are injected by scripts/finalize-poc.sh into a Secret blueprint.
version: 1
metadata:
  name: poc-oidc-apps
entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: Argo CD Admins
    attrs:
      name: Argo CD Admins

  - model: authentik_core.group
    state: present
    identifiers:
      name: Argo CD Viewers
    attrs:
      name: Argo CD Viewers

  - model: authentik_core.group
    state: present
    identifiers:
      name: Vault Admins
    attrs:
      name: Vault Admins

  - model: authentik_core.group
    state: present
    identifiers:
      name: Platform Admins
    attrs:
      name: Platform Admins

  - model: authentik_providers_oauth2.scopemapping
    id: groups-scope
    state: present
    identifiers:
      name: POC OpenID groups
    attrs:
      name: POC OpenID groups
      scope_name: groups
      expression: |
        return {
          "groups": [g.name for g in request.user.ak_groups.all()],
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    state: present
    identifiers:
      name: Argo CD
    attrs:
      name: Argo CD
      client_type: confidential
      client_id: !Env ARGOCD_OIDC_CLIENT_ID
      client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://argocd.local/api/dex/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf groups-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: argocd
    attrs:
      name: Argo CD
      slug: argocd
      provider: !KeyOf argocd-provider
      policy_engine_mode: any
      meta_launch_url: http://argocd.local

  - model: authentik_providers_oauth2.oauth2provider
    id: vault-provider
    state: present
    identifiers:
      name: Vault
    attrs:
      name: Vault
      client_type: confidential
      client_id: !Env VAULT_OIDC_CLIENT_ID
      client_secret: !Env VAULT_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://vault.local/ui/vault/auth/oidc/oidc/callback
        - matching_mode: strict
          url: http://vault.local/oidc/callback
        - matching_mode: strict
          url: http://localhost:8250/oidc/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf groups-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: vault
    attrs:
      name: Vault
      slug: vault
      provider: !KeyOf vault-provider
      policy_engine_mode: any
      meta_launch_url: http://vault.local

  - model: authentik_providers_oauth2.oauth2provider
    id: headlamp-provider
    state: present
    identifiers:
      name: Headlamp
    attrs:
      name: Headlamp
      client_type: confidential
      client_id: !Env HEADLAMP_OIDC_CLIENT_ID
      client_secret: !Env HEADLAMP_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://headlamp.local/oidc-callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf groups-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      slug: headlamp
      provider: !KeyOf headlamp-provider
      policy_engine_mode: any
      meta_launch_url: http://headlamp.local

  - model: authentik_providers_oauth2.oauth2provider
    id: workflows-provider
    state: present
    identifiers:
      name: Argo Workflows
    attrs:
      name: Argo Workflows
      client_type: confidential
      client_id: !Env WORKFLOWS_OIDC_CLIENT_ID
      client_secret: !Env WORKFLOWS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://workflows.local/oauth2/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf groups-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: workflows
    attrs:
      name: Argo Workflows
      slug: workflows
      provider: !KeyOf workflows-provider
      policy_engine_mode: any
      meta_launch_url: http://workflows.local
