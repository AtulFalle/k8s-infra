apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: todo
    environment: dev
  annotations:
    # Image Updater sets image.tag from Docker Hub sha-* builds (no Git commit to master).
    argocd-image-updater.argoproj.io/image-list: todo=atulfalle1815/todo
    argocd-image-updater.argoproj.io/todo.update-strategy: newest-build
    argocd-image-updater.argoproj.io/todo.allow-tags: regexp:^sha-[a-f0-9]{7}$
    argocd-image-updater.argoproj.io/todo.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/todo.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/cascade
spec:
  project: workloads
  source:
    repoURL: https://github.com/AtulFalle/k8s-infra.git
    targetRevision: HEAD
    path: charts/todo
    helm:
      releaseName: todo
      valueFiles:
        - ../../envs/todo/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-dev
  # Dev tracks latest sha-* via Image Updater but requires manual sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
