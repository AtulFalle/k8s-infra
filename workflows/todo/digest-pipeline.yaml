# Two-step CronWorkflow reference: extract → run todo `job digest`
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: todo-digest-pipeline
  namespace: todo-dev
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: workflow
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  workflowSpec:
    serviceAccountName: argo-workflow
    imagePullSecrets:
      - name: dockerhub
    entrypoint: pipeline
    templates:
      - name: pipeline
        steps:
          - - name: extract
              template: extract
            - name: digest
              template: run-digest
      - name: extract
        container:
          image: alpine:3.20
          command: [sh, -c]
          args:
            - echo "extract step complete env=${APP_ENV:-dev}"
          env:
            - name: APP_ENV
              value: dev
      - name: run-digest
        container:
          image: atulfalle1815/todo:0.1.2
          imagePullPolicy: Always
          command: [node, server.js, job, digest]
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/todo.db
            - name: APP_ENV
              value: dev
            - name: APP_VERSION
              value: "0.1.2"
          envFrom:
            - secretRef:
                name: todo-secrets
          volumeMounts:
            - name: data
              mountPath: /data
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: todo
