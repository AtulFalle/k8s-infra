# Default values for the demo application chart.
replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

# Gateway API HTTPRoute (optional; requires Gateway API CRDs + controller)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames: []
  rules: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# External Secrets → Vault
secrets:
  enabled: false
  vaultServer: http://vault.vault.svc.cluster.local:8200
  vaultMount: secret
  vaultAuthMount: kubernetes
  vaultPath: ""
  vaultRole: ""
  serviceAccountName: ""
  refreshInterval: 1h
  keys:
    - DB_HOST
    - DB_NAME
    - DB_USER
    - DB_PASSWORD
