{{- if .Values.secrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vaultServer | default "http://vault.vault.svc.cluster.local:8200" | quote }}
      path: {{ .Values.secrets.vaultMount | default "secret" | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.vaultAuthMount | default "kubernetes" | quote }}
          role: {{ required "secrets.vaultRole is required when secrets.enabled" .Values.secrets.vaultRole | quote }}
          serviceAccountRef:
            name: {{ .Values.secrets.serviceAccountName | default (include "app.serviceAccountName" .) | quote }}
{{- end }}
