{{- range $name, $cj := .Values.cronjobs }}
{{- if $cj.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "todo.fullname" $ }}-{{ $name }}
  labels:
    {{- include "todo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cron
    todo/job: {{ $cj.job | quote }}
spec:
  schedule: {{ $cj.schedule | quote }}
  concurrencyPolicy: {{ $cj.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $cj.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cj.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $cj.backoffLimit | default 0 }}
      activeDeadlineSeconds: {{ $cj.activeDeadlineSeconds | default 300 }}
      template:
        metadata:
          labels:
            {{- include "todo.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: cron
            todo/job: {{ $cj.job | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $.Values.serviceAccount.name }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: job
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["node", "server.js", "job", {{ $cj.job | quote }}]
              env:
                - name: PORT
                  value: {{ $.Values.service.targetPort | quote }}
                - name: DB_PATH
                  value: {{ printf "%s/todo.db" $.Values.persistence.mountPath | quote }}
                {{- range $key, $value := $.Values.config }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- if $.Values.secrets.enabled }}
              envFrom:
                - secretRef:
                    name: {{ include "todo.fullname" $ }}-secrets
              {{- end }}
              {{- with $.Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if $.Values.persistence.enabled }}
              volumeMounts:
                - name: data
                  mountPath: {{ $.Values.persistence.mountPath }}
              {{- end }}
          {{- if $.Values.persistence.enabled }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "todo.fullname" $ }}
          {{- end }}
{{- end }}
{{- end }}
